<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project - web -aparat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body dir="rtl" >
    <div class="div-header">
        <header class="header-web" >
            <div class="div-user">
                <button class="button-user" >
                    <i class="	fa fa-user" ></i>
                </button>
            </div>
            <div class="div-nine-dots">
                <img class="img-nine-dots" src="img-svg/dots-nine-bold-svgrepo-com.svg" alt="">
            </div>
            <div class="div-search">
                <i class="fas fa-search" ></i>
            </div>
            <div class="div-aparat-white">
                <img src="img/aparat-white.png" alt="">
            </div>
        </header>
    </div>
    <div class="div-button" >
        <button class="button" >برای شما</button>
        <button class="button" >پخش زنده</button>
        <button class="button" >سیاسی</button>
    </div>
    <br><br>
    <div class="div-sing-in">
        <div class="div-sing">
            <div class="div-img" >
                <img class="img" src="img/img.png" alt="">
            </div>
            <div class="div-p">
                <P class="p-big" >ویدیو های دست چین
                    <br> برای شما</P>
            </div>
            <div class="div-small">
                <P class="p-small" >با ورود به حساب از امکانات بیشتری استفاده می کنید و</P>
            </div>
            <div class="div-small-2">
                <P class="p-small-2" >همچنین ویدیوهایی مطابق خودتان می بینید</P>
            </div>
            <button class="button-2" >
                    ورود به حساب آپارات
            </button>
        </div>
    </div>
    <div class="div-p-small">
        <P class="p-font" >آپارات شورتش </P>
    </div>
    <div class="div-print" >
        <button class="button-3" >
            پخش همه
        </button>
    </div>
    <div class="div-img-print">
        <img src="img-print/img-1.png" alt="">
        <img src="img-print/print-1.png" alt="">
    </div>
    <br>
    <div class="div-img-print">
        <img src="img-print/img-print-1.png" alt="">
        <img src="img-print/img-print-2.png" alt="">
    </div>
    <br>
    <div class="div-p-small">
        <P class="p-font" >ویژه های آپارات</P>
    </div>
    <div class="div-big">
        <img src="img-print/img1.png" alt="">
    </div>
    <br>
    <div class="div-big">
        <img src="img-print/img2.png" alt="">
    </div>
    <br>
    <div class="div-big">
        <img src="img-print/img3.png" alt="">
    </div>
</body>
</html>
